[package]
name = "fp6-usb-modes"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "USB connection preferences for Lomiri on the Fairphone 6: combinable gadget functions (USB network, MTP, ADB) and the USB-C power role"

[lib]
name = "fp6_usbmodes"
path = "src/lib.rs"

[[bin]]
name = "fp6-usbmoded"
path = "src/bin/helper.rs"

[[bin]]
name = "fp6-usbmodes-agent"
path = "src/bin/agent.rs"

[[bin]]
name = "fp6-usbmodes-cli"
path = "src/bin/cli.rs"

[dependencies]
gio = "0.20"
glib = "0.20"
libc = "0.2"
serde = "1"
serde_json = "1"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
