[package]
name = "xdg-desktop-portal-lomiri"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "xdg-desktop-portal FileChooser backend for Lomiri (FP6): shows a Lomiri UI Toolkit file picker"
publish = false

[dependencies]
blocking = "1"
libc = "0.2"
serde_json = "1"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
