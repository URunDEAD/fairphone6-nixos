[package]
name = "fp6-dictation"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Private offline PipeWire dictation for Maliit"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
configparser = "3"
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
whisper-rs = "0.16"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile = "3"
