[package]
name = "fp6-usb-drive"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "USB Drive for Lomiri on the Fairphone 6: host ISO/IMG files as a USB CD-ROM or disk (mass_storage gadget function)"

[lib]
name = "fp6_usbdrive"
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "fp6-usb-drived"
path = "src/bin/helper.rs"

[[bin]]
name = "fp6-usb-drive-agent"
path = "src/bin/agent.rs"

[[bin]]
name = "fp6-usb-drive-cli"
path = "src/bin/cli.rs"

[dependencies]
gio = "0.20"
glib = "0.20"
libc = "0.2"
serde = "1"
serde_json = "1"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
