# Audited against sibling sources; see DESIGN.md. No activation, no writes.
[[probe]]
id = "quickshare"
unit = "fp6-quickshare.service"
name = "com.fairphone6.QuickShare1"
path = "/com/fairphone6/QuickShare1"
interface = "com.fairphone6.QuickShare1"
property = "State"
shape = "string"
values = ["idle", "discovering", "transferring"]

[[probe]]
id = "webshare"
unit = "fp6-webshare.service"
name = "com.fairphone6.WebShare1"
path = "/com/fairphone6/WebShare1"
interface = "com.fairphone6.WebShare1"
method = "Status"
shape = "json-object"
fields = { active = "bool", files = "array", pending = "array" }

[[probe]]
id = "kdeconnect"
unit = "lomiri-kdeconnect.service"
name = "com.fairphone6.KdeConnect1"
path = "/com/fairphone6/KdeConnect1"
interface = "com.fairphone6.KdeConnect1"
method = "Devices"
shape = "json-object"
fields = { devices = "array", plugins = "array" }

[[probe]]
id = "ocr"
unit = "fairphone-ocr.service"
name = "com.fairphone6.Ocr1"
path = "/com/fairphone6/Ocr1"
interface = "com.fairphone6.Ocr1"
method = "GetSettings"
shape = "json-object"
fields = { index_enabled = "bool" }

[[probe]]
id = "dictation"
unit = "fp6-dictation.service"
name = "com.fairphone6.Dictation1"
path = "/com/fairphone6/Dictation1"
interface = "com.fairphone6.Dictation1"
property = "State"
shape = "string"

[[probe]]
id = "share"
unit = "fp6-share.service"
name = "com.fairphone6.Share1"
path = "/com/fairphone6/Share1"
interface = "com.fairphone6.Share1"
method = "Snapshot"
shape = "json-object"
fields = { revision = "number", busy = "bool", targets = "array" }

[[probe]]
id = "calls"
unit = "fp6-calls.service"
name = "com.fairphone6.Calls1"
path = "/com/fairphone6/Calls1"
interface = "com.fairphone6.Calls1"
method = "Calls"
shape = "json-array"

[[probe]]
id = "netpolicy"
unit = "fp6-netpolicy.service"
name = "org.fairphone.NetPolicy1"
path = "/org/fairphone/NetPolicy1"
interface = "org.fairphone.NetPolicy1"
method = "GetStatus"
shape = "json-object"
fields = { settings = "object", snapshot = "object", route = "string" }

# Helper exports ONLY Sync and SetMobilePreferred. Neither is safe to call.
[[probe]]
id = "netpolicy-helper"
unit = "fp6-netpolicy-helper.service"
bus = "system"
name = "org.fairphone.NetPolicy.Helper1"
path = "/org/fairphone/NetPolicy/Helper1"
interface = "org.fairphone.NetPolicy.Helper1"

# Standard notification daemon metadata; DND policy is separate below.
[[probe]]
id = "notifications"
name = "org.freedesktop.Notifications"
path = "/org/freedesktop/Notifications"
interface = "org.freedesktop.Notifications"
method = "GetServerInformation"
shape = "server-information"

# Endpoints below were audited against the service sources and the r5 phone
# (busctl list/introspect, 2026-10-28). Presence-only probes call nothing.
[[probe]]
id = "usb-modes"
unit = "fp6-usbmoded.service"
bus = "system"
name = "com.fairphone6.UsbModes"
path = "/com/fairphone6/UsbModes"
interface = "com.fairphone6.UsbModes1"
method = "GetStatus"
shape = "json-object"
fields = { version = "number", functions = "array", available = "object" }

# Update1 only exposes the generic Call(ss) dispatcher: presence only.
[[probe]]
id = "ota"
unit = "fp6-updated.service"
bus = "system"
name = "com.fairphone6.Update"
path = "/com/fairphone6/Update"
interface = "com.fairphone6.Update1"

[[probe]]
id = "dnd"
unit = "fp6-notifyd.service"
name = "com.fairphone6.Dnd"
path = "/com/fairphone6/Dnd"
interface = "com.fairphone6.Dnd"
property = "Active"
shape = "bool"

[[probe]]
id = "battery"
unit = "fp6-batteryd.service"
bus = "system"
name = "com.fairphone6.Battery"
path = "/com/fairphone6/Battery"
interface = "com.fairphone6.Battery"
method = "GetStatus"
shape = "json-object"
fields = { level = "number", charging = "object", health = "object" }

# Status is a snapshot (memory counters, per-app state); it changes nothing.
[[probe]]
id = "app-ready"
unit = "fp6-app-ready.service"
name = "com.fairphone6.AppReady"
path = "/com/fairphone6/AppReady"
interface = "com.fairphone6.AppReady"
method = "Status"
shape = "json-object"
fields = { apps = "array", mem = "object" }

# fp6-privacyd has no bus name; its indicator is the D-Bus face.
[[probe]]
id = "privacy"
unit = "fp6-privacy-indicator.service"
name = "com.lomiri.indicator.privacy"
path = "/com/lomiri/indicator/privacy"
interface = "org.gtk.Actions"

# The user daemon fp6-gestures has no bus name; it drives the repowerd
# (fp6-lomiri-powerd) Gestures interface on the system bus.
[[probe]]
id = "gestures"
unit = "fp6-lomiri-powerd.service"
bus = "system"
name = "com.lomiri.Repowerd"
path = "/com/fairphone6/Gestures"
interface = "com.fairphone6.Gestures"
