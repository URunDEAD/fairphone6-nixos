[package]
name = "fp6-selftest"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Private read-only post-update smoke tests for Fairphone 6"

[features]
default = []
ui = ["dep:qmetaobject"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
nix = { version = "0.30", features = ["signal", "process", "fs", "user"] }
qmetaobject = { version = "0.2.10", optional = true }
regex = "1"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
tempfile = "3"
toml = "0.8"
zbus = "5"

[[bin]]
name = "fp6-selftest-ui"
path = "src/bin/ui.rs"
required-features = ["ui"]
