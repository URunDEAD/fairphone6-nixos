[package]
name = "fp6-callkit"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Session call broker for Fairphone 6 / Lomiri"

[dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"

[dev-dependencies]

[[bin]]
name = "fp6-callsd"
path = "src/bin/callsd.rs"

[[bin]]
name = "fp6-voip-demo"
path = "src/bin/demo.rs"
