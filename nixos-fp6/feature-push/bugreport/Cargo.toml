[package]
name = "fp6-bugreport"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Private, local diagnostics for Fairphone 6 / Lomiri"

[features]
default = []
gui = ["dep:qmetaobject"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
tempfile = "3"
zstd = "0.13"
qmetaobject = { version = "0.2.10", optional = true }

[[bin]]
name = "fp6-bugreport-gui"
path = "src/bin/gui.rs"
required-features = ["gui"]
