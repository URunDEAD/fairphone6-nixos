# Fairphone (Gen. 6) "Voice Call" verb: routing only.
#
# There is no modem->ADSP voice graph on this mainline/AudioReach stack (the
# topology has only MultiMedia1/2; no VCPM/voice support in q6apm). VoLTE call
# audio is carried by imsd-media through PipeWire (pw-play / pw-record on the
# default sink/source), so a call uses the same PCMs as HiFi. This verb only
# switches the amplifiers to the stock call profiles, like the stock FP6
# mixer_paths: "voice-speaker" = both amps, profile voice; "handset" /
# "voice-handset" = top amp alone, profile receiver. Lomiri telephony-service
# selects this profile ("Voice Call") during a call and restores HiFi after.
# Circuit-switched (2G/3G) call audio is NOT supported by this verb.

# No ConflictingDevice entries on purpose: devices on one PCM then become
# ports of ONE sink/source inside ONE profile, so telephony-service (and the
# dialer speaker toggle) can switch Earpiece <-> Speaker by port. Conflicting
# devices made PipeWire split each verb into per-device profiles. Every
# output sequence starts by muting the amps, so any order/combination of
# Speaker/Earpiece sequences still ends with both amps <= 352.

SectionVerb {
	Value {
		TQ "Voice"
	}

	EnableSequence [
		cset "name='SEN_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 1"
	]
}

SectionDevice."Speaker" {
	Comment "Speakerphone"

	EnableSequence [
		cset "name='Amplifier L PCM Playback Volume' 0"
		cset "name='Amplifier R PCM Playback Volume' 0"
		cset "name='Amplifier L Profile Set' voice"
		cset "name='Amplifier R Profile Set' voice"
		cset "name='Amplifier L PCM Playback Volume' 352"
		cset "name='Amplifier R PCM Playback Volume' 352"
	]

	DisableSequence [
		cset "name='Amplifier L PCM Playback Volume' 0"
		cset "name='Amplifier R PCM Playback Volume' 0"
		cset "name='Amplifier L Profile Set' music"
		cset "name='Amplifier R Profile Set' music"
	]

	Value {
		PlaybackPriority 50
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece"

	# Only the top amplifier (left I2S slot) plays; mono streams are upmixed
	# to both slots by PipeWire. 320 = -10 dB: conservative start for the
	# receiver profile, to be tuned by ear (never above 352).
	EnableSequence [
		cset "name='Amplifier R PCM Playback Volume' 0"
		cset "name='Amplifier L PCM Playback Volume' 0"
		cset "name='Amplifier L Profile Set' receiver"
		cset "name='Amplifier L PCM Playback Volume' 320"
	]

	DisableSequence [
		cset "name='Amplifier L PCM Playback Volume' 0"
		cset "name='Amplifier L Profile Set' music"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Mic1" {
	Comment "Bottom microphone"

	# WCD9378 ADC1 <- AMIC1 -> SoundWire -> TX macro DEC0 -> TX_CODEC_DMA_TX_3.
	# Codec-side controls exist only with the stock wcd9378 driver (see the
	# pmOS original for the SDCA-prototype fallback kept below).
	If.codec {
		Condition {
			Type ControlExists
			Control "name='ADC1 MUX'"
		}
		True {
			EnableSequence [
				cset "name='ADC1 MUX' CH1_AMIC1"
				cset "name='ADC1 Switch' 1"
				cset "name='ADC1 Volume' 12"
				cset "name='TX0 MODE' ADC_NORMAL"
				cset "name='TX0 SEQUENCER Switch' 1"
				cset "name='TX SMIC MUX0' SWR_MIC0"
				cset "name='TX DEC0 MUX' SWR_MIC"
				cset "name='TX_DEC0 Volume' 84"
				cset "name='TX_AIF1_CAP Mixer DEC0' 1"
			]

			DisableSequence [
				cset "name='TX_AIF1_CAP Mixer DEC0' 0"
				cset "name='TX0 SEQUENCER Switch' 0"
				cset "name='ADC1 Switch' 0"
				cset "name='TX SMIC MUX0' ZERO"
			]
		}
		False {
			EnableSequence [
				cset "name='TX SMIC MUX0' SWR_MIC0"
				cset "name='TX DEC0 MUX' SWR_MIC"
				cset "name='TX_DEC0 Volume' 84"
				cset "name='TX_AIF1_CAP Mixer DEC0' 1"
			]

			DisableSequence [
				cset "name='TX_AIF1_CAP Mixer DEC0' 0"
				cset "name='TX SMIC MUX0' ZERO"
			]
		}
	}

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
	}
}

# BEGIN Mic2 (removed by ucm-package.nix unless topMic = true)
SectionDevice."Mic2" {
	Comment "Top microphone"

	# Stock "speaker-mic": ADC2 mux CH2_AMIC3 (the only ADC whose sys-usage
	# profile accepts AMIC3 in the wcd9378 driver), MIC BIAS3 via DT routing.
	#
	# SoundWire channel quirk (root cause of "first capture, then zeros",
	# results/feature-push-20261024/audio/mic2-README.md): WCD9378 TX port 2
	# (ADC2) is mapped to SWR2 master port 1 (DT qcom,port-mapping <1 1 1 2 3>)
	# and the driver wants master channel 2 (SWR_MIC1), but this kernel's
	# qcom soundwire master has no set_channel_map and programs the master
	# port with the slave's channel mask (ch 1). ADC2 samples therefore
	# arrive on SWR_MIC0, and SWR_MIC1 is an empty slot: it only ever
	# showed the TX-macro decimator start-up click (~0.5 s, -30 dBFS),
	# which looked like "signal on the first capture".
	#
	# So DEC0 reads SWR_MIC0. ASoC DAPM only powers SWR_MIC0 through
	# "TX SWR_INPUT0" <- ADC1_OUTPUT <- TX0 SEQUENCER, so the ADC1 sequencer
	# is powered with its SoundWire port OFF ("ADC1 Switch" 0: no ADC1 data
	# on the bus), and a muted dummy DEC1 on SWR_MIC1 keeps the ADC2
	# sequencer (TX1) on a complete DAPM path. TX0_AMIC1 + TX1_AMIC3 is a
	# valid sys-usage profile (0). Mic1 and Mic2 share hw:F6,1, so ACP
	# never enables both; dual-mic capture needs a kernel channel-map fix.
	# DEC1 is enabled before DEC0 because the TX macro unmutes only the
	# last-enabled decimator (DEC0 = PCM channel 0, the one PipeWire uses).
	If.codec {
		Condition {
			Type ControlExists
			Control "name='ADC2 MUX'"
		}
		True {
			EnableSequence [
				cset "name='TX_AIF1_CAP Mixer DEC0' 0"
				cset "name='ADC1 Switch' 0"
				cset "name='ADC1 MUX' CH1_AMIC1"
				cset "name='TX0 MODE' ADC_NORMAL"
				cset "name='TX0 SEQUENCER Switch' 1"
				cset "name='ADC2 MUX' CH2_AMIC3"
				cset "name='ADC2 Switch' 1"
				cset "name='ADC2 Volume' 12"
				cset "name='TX1 MODE' ADC_NORMAL"
				cset "name='TX1 SEQUENCER Switch' 1"
				cset "name='TX SMIC MUX1' SWR_MIC1"
				cset "name='TX DEC1 MUX' SWR_MIC"
				cset "name='TX_DEC1 Volume' 0"
				cset "name='TX_AIF1_CAP Mixer DEC1' 1"
				cset "name='TX SMIC MUX0' SWR_MIC0"
				cset "name='TX DEC0 MUX' SWR_MIC"
				cset "name='TX_DEC0 Volume' 84"
				cset "name='TX_AIF1_CAP Mixer DEC0' 1"
			]

			# lpass-tx-macro keeps ONE "active decimator" per AIF: a
			# clear is ignored once another clear has run, so DEC1 has
			# to be re-armed (set 1) before its clear sticks.
			DisableSequence [
				cset "name='TX_AIF1_CAP Mixer DEC0' 0"
				cset "name='TX_AIF1_CAP Mixer DEC1' 1"
				cset "name='TX_AIF1_CAP Mixer DEC1' 0"
				cset "name='TX SMIC MUX1' ZERO"
				cset "name='TX_DEC1 Volume' 84"
				cset "name='TX1 SEQUENCER Switch' 0"
				cset "name='ADC2 Switch' 0"
				cset "name='TX0 SEQUENCER Switch' 0"
				cset "name='TX SMIC MUX0' ZERO"
			]
		}
	}

	Value {
		CapturePriority 50
		CapturePCM "hw:${CardId},1"
	}
}
# END Mic2
