[package]
name = "fp6-callrec"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Call recorder for the Fairphone 6 (oFono/imsd call state -> separate uplink/downlink files)"
publish = false

[dependencies]
alsa = "0.9"
gio = "0.20"
libc = "0.2"
rusqlite = "0.32"
serde_json = "1"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
