# FP6 accessibility audio (mono, balance): the script and its settings.
wireplumber.components = [
  {
    name = fp6/a11y-audio.lua, type = script/lua
    provides = fp6.a11y-audio
  }
]
wireplumber.profiles = {
  main = { fp6.a11y-audio = required }
}
wireplumber.settings.schema = {
  fp6.a11y.mono-audio = {
    name = "Mono audio"
    description = "Play the same mono mix on both channels of stereo outputs"
    type = "bool"
    default = false
  }
  fp6.a11y.audio-balance = {
    name = "Audio balance"
    description = "Left/right balance of stereo outputs (-1 left only, 0 centre, 1 right only)"
    type = "float"
    default = 0.0
    min = -1.0
    max = 1.0
  }
}
