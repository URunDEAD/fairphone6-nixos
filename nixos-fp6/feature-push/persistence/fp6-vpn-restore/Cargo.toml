[package]
name = "fp6-vpn-restore"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Reconnects NetworkManager VPNs after a restart (restore last state / always-on) for Lomiri on the Fairphone 6"

[dependencies]
gio = "0.20"
glib = "0.20"

[profile.release]
opt-level = "s"
lto = true
strip = true
