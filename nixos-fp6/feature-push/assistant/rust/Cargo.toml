[package]
name = "fp6-assistant"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "On-device assistant for the Fairphone 6 (Lomiri): chat with a local or remote LLM that can use the phone's apps through permission-gated tools"

[features]
default = []
# The Lomiri UI (qmetaobject bridge); the daemon, CLI and tests build without Qt.
ui = ["dep:qmetaobject", "dep:cstr"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
futures-util = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "process", "fs", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
zbus = { version = "5", default-features = false, features = ["tokio", "blocking-api"] }
# E-mail (no e-mail client exists on the phone): IMAP over TLS, SMTP submission.
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "0.26"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls", "hostname"] }
mail-parser = "0.9"
rusqlite = "0.37"
qmetaobject = { version = "0.2", optional = true }
cstr = { version = "0.2", optional = true }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "fp6-assistantd"
path = "src/main.rs"

[[bin]]
name = "fp6-assistant-ctl"
path = "src/ctl.rs"

[[bin]]
name = "fp6-assistant"
path = "src/ui.rs"
required-features = ["ui"]

[profile.release]
opt-level = "s"
lto = true
strip = true
