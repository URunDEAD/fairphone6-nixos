[package]
name = "lomiri-kdeconnect"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Privacy-first KDE Connect companion for Lomiri"

[features]
default = []
ui = ["dep:qmetaobject", "dep:cstr"]

[dependencies]
anyhow = "1"
base64 = "0.22"
evdev = "0.13"
futures-util = "0.3"
if-addrs = "0.15"
openssl = "0.10"
qmetaobject = { version = "0.2", optional = true }
cstr = { version = "0.2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
tokio = { version = "1", features = ["full"] }
tokio-openssl = "0.6"
url = "2"
uuid = { version = "1", features = ["v4"] }
zbus = { version = "5", default-features = false, features = ["tokio", "blocking-api"] }

tempfile = "3"

[dev-dependencies]

[[bin]]
name = "lomiri-kdeconnectd"
path = "src/main.rs"

[[bin]]
name = "lomiri-kdeconnect"
path = "src/ui.rs"
required-features = ["ui"]

[[bin]]
name = "kdeconnectctl"
path = "src/cli.rs"
