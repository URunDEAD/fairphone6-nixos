[package]
name = "fp6-captions"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Private offline streaming captions for Lomiri"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hound = "3.5"
futures-lite = "2"
qmetaobject = "0.2.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
whisper-rs = "0.16"
zbus = { version = "5", default-features = false, features = ["tokio", "blocking-api"] }

[dev-dependencies]
tempfile = "3"
