[package]
name = "fp6-share"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Unified private sharing for Lomiri"

[features]
default = []
ui = ["dep:qmetaobject"]

[dependencies]
anyhow = "1"
tempfile = "3"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
zbus = { version = "5", default-features = false, features = ["tokio", "blocking-api"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "fs", "process", "io-util"] }
futures-util = "0.3"
qmetaobject = { version = "0.2", optional = true }


[[bin]]
name = "fp6-share"
path = "src/main.rs"

[[bin]]
name = "fp6-share-ui"
path = "src/ui.rs"
required-features = ["ui"]
